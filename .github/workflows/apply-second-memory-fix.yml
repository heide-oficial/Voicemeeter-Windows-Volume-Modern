name: Build second memory fix

on:
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out updated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/stop-audio-endpoint-refresh-churn

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compile application
        shell: pwsh
        run: dotnet build native/VMWV.App/VMWV.App.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None -v:minimal

      - name: Build portable x64 executable
        shell: pwsh
        run: ./scripts/build-release.ps1 -Platform x64 -SkipSetup

      - name: Upload replacement portable build
        uses: actions/upload-artifact@v4
        with:
          name: Voicemeeter-Windows-Volume-Modern-second-fix-portable-x64
          path: artifacts/release/VoicemeeterWindowsVolumeModern-Portable-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
