name: Build second memory fix

on:
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out updated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/stop-audio-endpoint-refresh-churn

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compile application
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build native/VMWV.App/VMWV.App.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None -v:minimal *> compile.log
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath compile.log
          exit $exitCode

      - name: Report compiler failure
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content -LiteralPath compile.log -Tail 80) -join "`n"
          $body = "Second-fix compile failed:`n`n``````text`n$tail`n``````"
          gh pr comment ${{ github.event.pull_request.number }} --body $body
          exit 1

      - name: Build portable EXE and MSI
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Platform x64

      - name: Upload replacement builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Voicemeeter-Windows-Volume-Modern-second-fix-x64
          path: |
            artifacts/release/VoicemeeterWindowsVolumeModern-Portable-x64.exe
            artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
