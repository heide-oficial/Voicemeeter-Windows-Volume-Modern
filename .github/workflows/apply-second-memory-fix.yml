name: Build second memory fix

on:
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out updated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/stop-audio-endpoint-refresh-churn

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable EXE and MSI
        shell: pwsh
        run: |
          & ./scripts/build-release.ps1 -Platform x64 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-fix-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload replacement builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Voicemeeter-Windows-Volume-Modern-second-fix-x64
          path: |
            artifacts/release/VoicemeeterWindowsVolumeModern-Portable-x64.exe
            artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
